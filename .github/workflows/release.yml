# Release builds for Windows, Linux and macOS.
#
# A tag `vX.Y.Z` builds veil-app, veil-node and veil-probe on each platform, packs them with
# the licences into one archive per platform (zip on Windows, tar.gz elsewhere), writes
# SHA256SUMS.txt for all of them, and creates a DRAFT GitHub release. Nothing reaches anyone
# until Jeremy reads the draft and presses Publish. A manual run (workflow_dispatch) builds
# and uploads the archives as workflow artifacts only, and publishes nothing: use it to check
# a build before tagging.
#
# Hardening:
# - Every action is pinned to a commit SHA (the version is in the comment).
# - No build cache: a release is built from a clean toolchain, so a poisoned cache from
#   another branch cannot reach it.
# - Only the publish job can write to the repository, and only on a tag.
# - Build provenance (`gh attestation verify`) once the repository is public; GitHub offers
#   attestations for private repositories on Enterprise plans only.
#
# shortcut: archives, not installers, and unsigned (Windows SmartScreen warns "unknown
# publisher", macOS Gatekeeper blocks until the user allows it). An installer should also add
# the firewall rule (docs/HANDOFF.md, firewall). Add installers with code signing and macOS
# notarisation before a wide release.
# shortcut: macOS is Apple Silicon only. Add an x86_64-apple-darwin row if Intel Macs matter.
# Camera and microphone capture are Windows only so far (veil-app/src/media.rs), so the Linux
# and macOS builds can join calls but not send video or audio.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same toolchain as ci.yml and local builds.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.98.1"
      # Headers for eframe's X11 and Wayland back ends.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Version
        id: version
        shell: pwsh
        run: |
          $meta = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'veil-app').version
          if (-not $version) { throw 'veil-app has no version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match the workspace version v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build
        run: cargo build --release --locked -p veil-app -p veil-node -p veil-probe
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          $name = "veil-$env:VERSION-$env:PLATFORM"
          $exe = if ($IsWindows) { '.exe' } else { '' }
          $stage = Join-Path 'dist' $name
          New-Item -ItemType Directory -Force $stage | Out-Null
          $files = @(
            "target/release/veil-app$exe",
            "target/release/veil-node$exe",
            "target/release/veil-probe$exe",
            'LICENSE-MIT',
            'LICENSE-APACHE',
            'README.md',
            'docs/DEPENDENCIES.md',
            'crates/veil-node/veil-node.example.toml'
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "missing $f" }
            Copy-Item $f $stage
          }
          if ($IsWindows) {
            $archive = "$name.zip"
            Compress-Archive -Path "$stage/*" -DestinationPath "dist/$archive"
          } else {
            # tar keeps the executable bit, which a zip made by Compress-Archive drops.
            $archive = "$name.tar.gz"
            tar -czf "dist/$archive" -C dist $name
            if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          }
          Remove-Item -Recurse $stage
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$archive").Hash.ToLower()
          # LF and no BOM, so `sha256sum -c` reads it. The publish job joins these into
          # SHA256SUMS.txt.
          [IO.File]::WriteAllText("$PWD/dist/$archive.sha256", "$hash  $archive`n")
          Get-Content "dist/$archive.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Check files
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          test -s "veil-${VERSION}-windows-x64.zip"
          test -s "veil-${VERSION}-linux-x64.tar.gz"
          test -s "veil-${VERSION}-macos-arm64.tar.gz"
          cat ./*.sha256 > SHA256SUMS.txt
          rm ./*.sha256
          test "$(wc -l < SHA256SUMS.txt)" -eq 3
          sha256sum -c SHA256SUMS.txt
      - name: Provenance
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/veil-*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --draft \
            --verify-tag \
            --title "Veil $TAG" \
            --generate-notes
