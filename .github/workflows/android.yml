# Build the same pinned ARM64 development preview as mobile/android/build.ps1.
# No release credentials, publication or phone access. Desktop CI remains in ci.yml.
name: Android preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-preview:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.98.1"
          components: clippy
          targets: aarch64-linux-android
      - name: Pinned Android SDK and JDK
        shell: pwsh
        run: |
          $pins = Get-Content mobile/android/toolchain.json -Raw | ConvertFrom-Json
          "JAVA_HOME=$env:JAVA_HOME_17_X64" >> $env:GITHUB_ENV
          "$env:JAVA_HOME_17_X64\bin" >> $env:GITHUB_PATH
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" "platforms;android-$($pins.compileSdk)" "build-tools;$($pins.buildTools)" "ndk;$($pins.ndk)"
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed.' }
      - name: Build and verify preview
        shell: pwsh
        run: ./mobile/android/build.ps1 -AndroidSdk $env:ANDROID_HOME -Check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veil-android-arm64-preview
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/debug/build-info.json
          if-no-files-found: error
          retention-days: 14
