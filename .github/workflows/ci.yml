# Tests, lints, licences and known advisories on every push and pull request.
# Tests run on Windows, where veil-media's Media Foundation and WASAPI code lives. Tests marked
# `#[ignore]` need a camera, microphone or open ports and are not run here. The `build` job
# lints and builds the release binaries on Linux and macOS, so release.yml cannot be the first
# place a non-Windows build breaks.
# Every action is pinned to a commit SHA (the version is in the comment), as in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the toolchain Veil is built with locally, so a new stable release cannot
      # fail the build with fresh deprecations. Raise it together with the local toolchain.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Tests
        run: cargo test --workspace --locked

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.98.1"
          components: clippy
      # Headers for eframe's X11 and Wayland back ends, ALSA for cpal, libclang for the v4l
      # bindings, and nasm for OpenH264's assembly. Keep in step with release.yml.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libpipewire-0.3-dev libegl-dev libgbm-dev libdrm-dev \
            libasound2-dev libclang-dev nasm pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Clippy covers the `cfg(not(windows))` stubs that the Windows job never compiles.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Build
        run: cargo build --locked -p veil-app -p veil-node -p veil-probe
      - name: Log folder tests
        run: cargo test --locked -p veil-app log::tests

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit
      - name: Advisories
        run: cargo audit
      - name: Licences
        run: python3 tools/licences.py --check
