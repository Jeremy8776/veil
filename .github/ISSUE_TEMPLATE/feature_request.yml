name: Idea
description: Something Veil should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: privacy
    attributes:
      label: Privacy
      description: Would this let anyone outside the call see more than they do now?
