# Weekly update pull requests. Actions stay pinned to commit SHAs; Dependabot moves the SHA
# and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # RustCrypto crates move in generations (digest, hybrid-array, rand_core): bumping one
      # alone does not build. One PR for the set, so they upgrade together. `hpke` and the
      # dalek crates follow the same generation.
      rustcrypto:
        patterns:
          - "aead"
          - "chacha20*"
          - "cipher"
          - "crypto-common"
          - "curve25519-dalek"
          - "digest"
          - "ed25519*"
          - "getrandom"
          - "hkdf"
          - "hmac"
          - "hpke"
          - "hybrid-array"
          - "poly1305"
          - "rand_chacha"
          - "rand_core"
          - "sha2"
          - "signature"
          - "x25519-dalek"
