[workspace]
resolver = "3"
members = [
    "crates/veil-call",
    "crates/veil-forward",
    "crates/veil-group",
    "crates/veil-net",
    "crates/veil-node",
    "crates/veil-rendezvous",
    "crates/veil-security",
    "crates/veil-topology",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
