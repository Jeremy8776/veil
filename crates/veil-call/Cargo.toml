[package]
name = "veil-call"
version.workspace = true
edition.workspace = true
# Follows veil-group, which needs Rust 1.91 for openmls.
rust-version = "1.91"
publish.workspace = true
license.workspace = true

[dependencies]
bytes = "1.7"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
postcard = { version = "1.0.10", default-features = false, features = ["alloc"] }
serde = { version = "1.0.210", features = ["derive"] }
tokio = { version = "1.40", features = ["rt", "time", "sync", "macros"] }
veil-forward = { path = "../veil-forward" }
veil-group = { path = "../veil-group" }
veil-net = { path = "../veil-net" }
veil-rendezvous = { path = "../veil-rendezvous" }
veil-security = { path = "../veil-security" }
veil-topology = { path = "../veil-topology" }

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
