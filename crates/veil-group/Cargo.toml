[package]
name = "veil-group"
version.workspace = true
edition.workspace = true
# openmls 0.9 needs Rust 1.91.
rust-version = "1.91"
publish.workspace = true
license.workspace = true

# Licences checked 16/11/2026. openmls, openmls_traits and openmls_memory_storage are MIT.
# `hpke` is MIT or Apache-2.0. openmls_rust_crypto is not used: it pulls hpke-rs (MPL-2.0).
[dependencies]
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
hkdf = "0.13.0"
hmac = "0.13.0"
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "chacha", "x25519"] }
openmls = "0.9.2"
openmls_memory_storage = "0.6.0"
openmls_traits = "0.6.0"
rand_chacha = "0.10.0"
rand_core = "0.10.1"
sha2 = "0.11.0"
tls_codec = "0.5.0"
veil-net = { path = "../veil-net" }
veil-security = { path = "../veil-security" }
zeroize = "1.8.1"

[lints]
workspace = true
