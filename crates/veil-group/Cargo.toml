[package]
name = "veil-group"
version.workspace = true
edition.workspace = true
# openmls 0.9 needs Rust 1.91.
rust-version = "1.91"
publish.workspace = true
license.workspace = true

# Licences checked 15/11/2026. openmls, openmls_traits and openmls_memory_storage are MIT.
# `hpke` is MIT or Apache-2.0. openmls_rust_crypto is not used: it pulls hpke-rs (MPL-2.0).
[dependencies]
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.1.1"
hkdf = "0.12.4"
hmac = "0.12.1"
hpke = { version = "0.13.0", default-features = false, features = ["alloc", "x25519"] }
openmls = "0.9.2"
openmls_memory_storage = "0.6.0"
openmls_traits = "0.6.0"
rand_chacha = "0.9.0"
rand_core = { version = "0.9.3", features = ["os_rng"] }
sha2 = "0.10.8"
tls_codec = "0.5.0"
veil-net = { path = "../veil-net" }
veil-security = { path = "../veil-security" }
zeroize = "1.8.1"

[dev-dependencies]
rand_core_06 = { package = "rand_core", version = "0.6.4", features = ["getrandom"] }

[lints]
workspace = true
