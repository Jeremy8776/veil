[package]
name = "veil-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Scalar engine only: SIMD (`simd-unsafe`) is unsafe code and gains nothing on 32-byte keys.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bytes = "1.7"
ed25519-dalek = "3.0.0"
if-addrs = "0.15.0"
postcard = { version = "1.0.10", default-features = false, features = ["alloc"] }
quinn = { version = "0.11.5", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.20", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.210", features = ["derive"] }
# Dual-stack sockets (`IPV6_V6ONLY` off), which std cannot set. Already in the tree through
# quinn, same version.
socket2 = "0.6.5"
tokio = { version = "1.40", features = ["rt", "time", "macros", "sync", "net"] }
veil-security = { path = "../veil-security" }
zeroize = "1.8.1"

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "net"] }

[lints]
workspace = true
