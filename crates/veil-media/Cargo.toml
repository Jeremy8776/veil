[package]
name = "veil-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
veil-security = { path = "../veil-security" }
# Screen and window capture on Windows, macOS and Linux (src/screen.rs).
xcap = "0.9.8"
zeroize = "1.8.1"

[build-dependencies]
# Builds the vendored libopus (vendor/opus) without cmake.
cc = "1.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "UI_Notifications",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Variant",
] }

# Linux and macOS: microphone and speakers through cpal (ALSA, Core Audio), and H.264 through
# OpenH264 built from source (see src/ffi/openh264.rs about patents).
[target.'cfg(not(windows))'.dependencies]
cpal = "0.18.2"
openh264-sys2 = { version = "0.9.10", default-features = false, features = ["source"] }

# The OpenH264 and cpal modules also build for tests on Windows, so they are compiled and
# exercised on the machine they are written on.
[target.'cfg(windows)'.dev-dependencies]
cpal = "0.18.2"
openh264-sys2 = { version = "0.9.10", default-features = false, features = ["source"] }

# The MJPEG module (src/mjpeg.rs) runs its tests on every platform; Linux also uses it for real.
[dev-dependencies]
zune-jpeg = "0.5.15"
# The segment tests check the embedded weights against their published hash.
sha2 = "0.11.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Lobby notifications over D-Bus (src/freedesktop.rs). Already in the tree through egui's
# accessibility (accesskit_unix), with the same features plus the blocking calls.
zbus = { version = "5.13.2", default-features = false, features = ["async-io", "blocking-api"] }
v4l = "0.14.0"
zune-jpeg = "0.5.15"

# macOS camera: AVFoundation through the objc2 bindings (src/ffi/macos).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media"] }
objc2-core-media = { version = "0.3.2", features = ["objc2-core-video"] }
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
# Lobby notifications (src/ffi/macos/notify.rs). Same objc2 family and version as above.
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
    "std",
    "bitflags",
    "block2",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

# The workspace forbids `unsafe`; this crate only denies it, so the one `ffi` module per OS can
# allow it (docs/TRANSPARENCY.md section 5). Keep the rest in step with the workspace table.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
