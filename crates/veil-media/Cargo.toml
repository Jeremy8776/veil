[package]
name = "veil-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
veil-security = { path = "../veil-security" }
zeroize = "1.8.1"

[build-dependencies]
# Builds the vendored libopus (vendor/opus) without cmake.
cc = "1.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Variant",
] }

[target."cfg(not(windows))".dependencies]
cpal = "0.18.2"
openh264 = { version = "0.9.10", default-features = false, features = ["source"] }

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14.0"
zune-jpeg = "0.5.15"

# The workspace forbids `unsafe`; this crate only denies it, so the one `ffi` module per OS can
# allow it (docs/TRANSPARENCY.md section 5). Keep the rest in step with the workspace table.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
