[package]
name = "veil-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
veil-security = { path = "../veil-security" }

[build-dependencies]
# Builds the vendored libopus (vendor/opus) without cmake.
cc = "1.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

# The workspace forbids `unsafe`; this crate only denies it, so the one `ffi` module per OS can
# allow it (docs/TRANSPARENCY.md section 5). Keep the rest in step with the workspace table.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
