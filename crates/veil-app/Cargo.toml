[package]
name = "veil-app"
version.workspace = true
edition.workspace = true
# Follows veil-call, which needs Rust 1.91 for openmls.
rust-version = "1.91"
publish.workspace = true
license.workspace = true

[features]
# For tools/dev-ui.ps1: lets VEIL_START choose the first screen. Never on in releases.
dev-ui = []

[lib]
name = "veil_app"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "sync"] }
veil-call = { path = "../veil-call" }
veil-forward = { path = "../veil-forward" }
veil-media = { path = "../veil-media" }
veil-net = { path = "../veil-net" }
veil-portmap = { path = "../veil-portmap" }
veil-rendezvous = { path = "../veil-rendezvous" }
veil-security = { path = "../veil-security" }
veil-topology = { path = "../veil-topology" }
zeroize = "1.8.1"
# The update check and download (src/update/): HTTPS to GitHub. rustls with ring, both
# already used by QUIC; no gzip, no cookies.
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
# Checking an update before it is installed (src/update/verify.rs): the release key's
# Ed25519 signature over SHA256SUMS.txt, then each file's SHA-256. Same versions as
# veil-security.
ed25519-dalek = "3.0.0"
sha2 = "0.11.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.154"
# No default features: egui's bundled fonts carry licences outside the allow list
# (tools/licences.py), so the app loads the operating system's own fonts at start-up.
eframe = { version = "0.37", default-features = false, features = [
    "clipboard",
    "wgpu",
] }
# Colour emoji in chat: draws the system emoji font's COLR (Windows), sbix (macOS) or CBDT
# (Linux) glyphs. The same epaint eframe uses; this only turns the feature on.
epaint = { version = "0.37", default-features = false, features = ["color_fonts"] }
qrcodegen = "1.8.0"
# Sealing the device key file on macOS and Linux (src/keystore/seal_os.rs), with a wrapping
# key held by the OS keychain. Same versions as veil-security; tested on every platform.
chacha20poly1305 = "0.11.0"
getrandom = { version = "0.4.3", features = ["sys_rng"] }

# The OS keychain that holds that wrapping key: Keychain on macOS, the Secret Service
# (GNOME Keyring, KWallet) over D-Bus on Linux. Pure Rust on Linux: zbus with async-io,
# the zbus 5 already pulled in by the desktop portal, and RustCrypto for the session.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
keyring-core = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = [
    "rt-async-io-crypto-rust",
] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.3", default-features = false, features = [
    "keychain",
] }

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "wayland", "x11"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["android-native-activity"] }
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }

[build-dependencies]
# Windows version information (build.rs). MIT; the same crate as ArtCraft uses.
winresource = { version = "0.1.34", default-features = false }

[lints]
workspace = true
