[package]
name = "veil-app"
version.workspace = true
edition.workspace = true
# Follows veil-call, which needs Rust 1.91 for openmls.
rust-version = "1.91"
publish.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "sync"] }
veil-call = { path = "../veil-call" }
veil-forward = { path = "../veil-forward" }
veil-media = { path = "../veil-media" }
veil-net = { path = "../veil-net" }
veil-rendezvous = { path = "../veil-rendezvous" }
veil-security = { path = "../veil-security" }
veil-topology = { path = "../veil-topology" }
zeroize = "1.8.1"
# The update check and download (src/update/): HTTPS to GitHub. rustls with ring, both
# already used by QUIC; no gzip, no cookies.
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
# Checking an update before it is installed (src/update/verify.rs): the release key's
# Ed25519 signature over SHA256SUMS.txt, then each file's SHA-256. Same versions as
# veil-security.
ed25519-dalek = "3.0.0"
sha2 = "0.11.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.154"
# No default features: egui's bundled fonts carry licences outside the allow list
# (tools/licences.py), so the app loads the operating system's own fonts at start-up.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "wgpu",
    "wayland",
    "x11",
] }

[lints]
workspace = true
