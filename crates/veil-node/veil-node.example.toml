# veil-node configuration. Copy to veil-node.toml and run: veil-node veil-node.toml
# The node prints each role as key@address. Put that in an invite's relay field.

# Created on first start, next to this file. Keep it private: it is this node's identity.
identity_file = "node.key"

# Who may host calls through this node. Without this line anyone who knows the node's
# address can run their calls through it and use your upload. With it, only these device
# keys may host (or run a reachability check); the guests they invite still join, under
# each host's own admission. In Veil, "Copy device key" on Home copies one.
# hosts = ["BASE64URL_DEVICE_KEY", "ANOTHER_DEVICE_KEY"]

# Address reflection and hole-punch introductions. Relays when direct links fail.
# "[::]:4433" listens on IPv4 and IPv6 at once, so the node can also reflect and check
# members' IPv6 addresses. "0.0.0.0:4433" is IPv4 only.
[rendezvous]
listen = "0.0.0.0:4433"
relay = true

# Receives each member's stream once and sends it to the rest of the room.
# Remove this section to run rendezvous only.
[forwarder]
listen = "0.0.0.0:4434"
max_rooms = 4096
# Rooms that links from one IPv4 address or IPv6 /64 may hold open, so one party
# cannot take every room. A room whose only member stays alone for 60 s is closed.
max_rooms_per_block = 16
max_members_per_room = 16

# Bounds on video queued for receivers, in MiB. A slow receiver's frames wait in memory,
# so size node_queue_mib to fit this machine's memory (it is the most the whole forwarder
# will hold for all receivers together). source_queue_mib caps what any one remote address
# (an IPv4 address, or an IPv6 /64) may hold of that, so one address cannot fill the node.
# Both are optional; source_queue_mib must not exceed node_queue_mib.
node_queue_mib = 1024
source_queue_mib = 128
