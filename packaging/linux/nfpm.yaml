# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com), made by package.sh, which stages
# the file tree, puts its path in place of ${STAGE} (nfpm does not expand variables in `src`)
# and exports VERSION and NFPM_ARCH. Modelled on ArtCraft's packaging/linux/nfpm.yaml.
name: veil
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: net
priority: optional
maintainer: Veil maintainers <noreply@github.com>
homepage: https://github.com/Jeremy8776/veil
license: MIT OR Apache-2.0
description: |-
  Peer-to-peer video calls, encrypted end to end.
  Includes veil-node (rendezvous, relay and forwarder) and veil-probe (a test client).

# veil-app links glibc, libgcc_s and ALSA (libasound) directly. Windowing (X11, Wayland,
# xkbcommon) and the GPU (Vulkan or EGL) are loaded at run time, so the package tools cannot
# find them: they are listed here, as winit 0.30 and wgpu load them.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libasound2t64 | libasound2
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcursor1
      - libxi6
      - libvulkan1 | libegl1
    recommends:
      - mesa-vulkan-drivers
  rpm:
    # Sonames rather than package names, so the same list resolves on Fedora and openSUSE.
    depends:
      - libasound.so.2()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libwayland-client.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libxcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - (libvulkan.so.1()(64bit) or libEGL.so.1()(64bit))

contents:
  - src: ${STAGE}/usr/bin/veil-app
    dst: /usr/bin/veil-app
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/veil-node
    dst: /usr/bin/veil-node
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/veil-probe
    dst: /usr/bin/veil-probe
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree
