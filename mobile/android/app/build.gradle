plugins { id 'com.android.application' }

def pins = new groovy.json.JsonSlurper().parse(rootProject.file('toolchain.json'))
android {
    namespace 'io.github.jeremy8776.veil'
    compileSdk pins.compileSdk
    buildToolsVersion pins.buildTools
    ndkVersion pins.ndk
    defaultConfig {
        applicationId 'io.github.jeremy8776.veil'
        minSdk 29
        targetSdk 36
        versionCode pins.preview.versionCode
        versionName pins.preview.versionName
        // build.ps1 -Emulator passes -PveilAbi=x86_64; phones use ARM64.
        ndk { abiFilters(project.findProperty('veilAbi') ?: 'arm64-v8a') }
    }
    buildTypes {
        debug { applicationIdSuffix '.preview'; debuggable true }
        release { minifyEnabled false }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
